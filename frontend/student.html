<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Academic Overview</title>
    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f2f5; --success: #27ae60; --warning: #e67e22; --danger: #e74c3c; --dark: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--dark); text-align: center; }
        .container { max-width: 1050px; margin: 0 auto; background: white; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); box-sizing: border-box; }
        
        .header-box { background: #eef2f3; padding: 25px; border-radius: 12px; margin-bottom: 25px; text-align: left; border-left: 6px solid var(--primary); }
        .student-profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: white; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #e0e0e0; }
        .profile-item { font-size: 14px; color: #555; }
        .profile-item strong { color: var(--primary); }

        .scanner-zone { display: none; margin: 20px auto; padding: 20px; background: #fafafa; border-radius: 12px; border: 2px dashed #ccc; max-width: 440px; animation: fadeIn 0.3s ease-in-out; }
        #previewVideo { width: 100%; max-width: 400px; border-radius: 8px; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.15); display: block; margin: 0 auto; }
        .btn-scan-trigger { background: var(--success); color: white; border: none; padding: 12px 30px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 25px; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; width: auto; }
        .btn-scan-trigger:hover { background: #219150; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(47,174,96,0.2); }

        /* Dynamic Year and Semester Navigation Controls */
        .year-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .year-btn { background: #eef2f3; border: 1px solid #ddd; padding: 10px 25px; font-weight: bold; border-radius: 6px; cursor: pointer; color: var(--primary); transition: 0.2s; }
        .year-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .sem-container { display: none; justify-content: center; gap: 10px; margin-bottom: 25px; background: #f9f9f9; padding: 10px; border-radius: 8px; }
        .sem-btn { background: white; border: 1px solid #ccc; padding: 8px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; color: #555; transition: 0.2s; }
        .sem-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* Modal Settings Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: white; padding: 30px; border-radius: 12px; width: 380px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); text-align: left; }
        .modal-card h3 { margin-top: 0; color: var(--primary); margin-bottom: 20px; }
        .modal-card label { font-weight: bold; font-size: 12px; color: #7f8c8d; display: block; margin-bottom: 5px; }
        .modal-card input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; outline: none; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-save { background: var(--success); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; }
        .btn-cancel { background: #95a5a6; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; }

        .table-responsive { width: 100%; overflow-x: auto; border-radius: 8px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; background: white; min-width: 850px; }
        th { background: #f8f9fa; padding: 14px 10px; border-bottom: 2px solid #ddd; border-right: 1px solid #ddd; font-size: 13px; color: #2c3e50; font-weight: bold; text-align: center; }
        td { padding: 12px 10px; border-bottom: 1px solid #eee; border-right: 1px solid #eee; font-size: 14px; text-align: center; }
        th:first-child, td:first-child { text-align: left; padding-left: 15px; }

        .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-good { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .badge-warn { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .badge-crit { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* Footer Row Styles */
        .action-footer { display: flex; gap: 20px; margin-top: 30px; width: 100%; }
        .btn-action { flex: 1; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-edit-trigger { background: var(--accent); color: white; }
        .btn-edit-trigger:hover { background: #2980b9; transform: translateY(-1px); }
        .btn-logout { background: var(--danger); color: white; }
        .btn-logout:hover { background: #c0392b; transform: translateY(-1px); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h1 style="margin:0; color:var(--primary); font-size: 28px;">🎓 Student Academic Portal</h1>
        <div class="student-profile-grid">
            <div class="profile-item"><strong>Student Name:</strong> <span id="profileName">Loading...</span></div>
            <div class="profile-item"><strong>University USN:</strong> <span id="profileUSN">Loading...</span></div>
            <div class="profile-item"><strong>Branch Specialization:</strong> <span id="profileBranch">AIML</span></div>
            <div class="profile-item"><strong>Current Class/Sec:</strong> <span id="profileClassSec">-</span></div>
        </div>
    </div>

    <button class="btn-scan-trigger" onclick="toggleQRScannerBox()">
        📷 Scan QR code
    </button>

    <div class="scanner-zone" id="cameraScannerBox">
        <h4 style="margin-top:0; color:var(--primary);">🎥 Scan the QR Code</h4>
        <video id="previewVideo"></video>
        <button class="btn-cancel" style="width:100%; padding:10px; border-radius:6px; margin-top:15px; border:none; font-weight:bold; cursor:pointer;" onclick="stopQRScannerCamera()">
            Close Camera Stream
        </button>
    </div>

    <div class="modal-overlay" id="profileEditModal">
        <div class="modal-card">
            <h3>✏️ Update Profile Settings</h3>
            <label for="editName">Full Name:</label>
            <input type="text" id="editName">
            <label for="editEmail">Email Address:</label>
            <input type="email" id="editEmail">
            <label for="editPassword">Account Password:</label>
            <input type="text" id="editPassword" placeholder="Enter password">
            <div class="modal-actions">
                <button class="btn-save" onclick="saveProfileChanges()">Save Changes</button>
                <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="year-bar">
        <button class="year-btn" id="year1Btn" onclick="selectYear(1)">Year 1</button>
        <button class="year-btn" id="year2Btn" onclick="selectYear(2)">Year 2</button>
        <button class="year-btn" id="year3Btn" onclick="selectYear(3)">Year 3</button>
        <button class="year-btn" id="year4Btn" onclick="selectYear(4)">Year 4</button>
    </div>

    <div class="sem-container" id="year1Sems">
        <button class="sem-btn" id="sem1Btn" onclick="selectSemester(1)">Semester 1</button>
        <button class="sem-btn" id="sem2Btn" onclick="selectSemester(2)">Semester 2</button>
    </div>
    <div class="sem-container" id="year2Sems">
        <button class="sem-btn" id="sem3Btn" onclick="selectSemester(3)">Semester 3</button>
        <button class="sem-btn" id="sem4Btn" onclick="selectSemester(4)">Semester 4</button>
    </div>
    <div class="sem-container" id="year3Sems">
        <button class="sem-btn" id="sem5Btn" onclick="selectSemester(5)">Semester 5</button>
        <button class="sem-btn" id="sem6Btn" onclick="selectSemester(6)">Semester 6</button>
    </div>
    <div class="sem-container" id="year4Sems">
        <button class="sem-btn" id="sem7Btn" onclick="selectSemester(7)">Semester 7</button>
        <button class="sem-btn" id="sem8Btn" onclick="selectSemester(8)">Semester 8</button>
    </div>

    <div class="table-responsive" style="margin-top: 15px;">
        <table>
            <thead>
                <tr>
                    <th style="text-align: left; padding-left: 15px; width: 22%;">Subject Description</th>
                    <th style="width: 10%;">CIE 1</th>
                    <th style="width: 10%;">CIE 2</th>
                    <th style="width: 10%;">CIE 3</th>
                    <th style="width: 10%;">Lab</th>
                    <th style="width: 10%;">SEE</th>
                    <th style="width: 28%;">Attendance Details</th>
                </tr>
            </thead>
            <tbody id="studentMarksTableBody">
                <tr><td colspan="7" style="text-align: center; color:#7f8c8d; padding: 25px;">Select a year and semester to display records.</td></tr>
            </tbody>
        </table>
    </div>

    <div class="action-footer">
        <button class="btn-action btn-edit-trigger" onclick="openEditModal()">⚙ Edit Profile Settings</button>
        <button class="btn-action btn-logout" onclick="handleStudentLogout()">Secure Portal Logout</button>
    </div>
</div>

<script>
    const currentStudentUSN = localStorage.getItem("user_usn") || localStorage.getItem("student_id") || "1DA24AI015";
    let activeScannerInstance = null;
    let globalAcademicRows = []; // Holds data records cleanly
    let cachedUserRawData = {};

    if (!localStorage.getItem("role") || localStorage.getItem("role") !== 'student') {
        window.location.href = 'login.html?role=student';
    }

    // Dynamic Multi-Year / Multi-Sem Toggle Engine
    function selectYear(yearNum) {
        // Toggle Year highlights
        document.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`year${yearNum}Btn`).classList.add('active');

        // Close all sem boxes and open target
        document.querySelectorAll('.sem-container').forEach(box => box.style.display = 'none');
        document.getElementById(`year${yearNum}Sems`).style.display = 'flex';

        // Auto default to the first semester of that year
        const defaultSems = { 1: 1, 2: 3, 3: 5, 4: 7 };
        selectSemester(defaultSems[yearNum]);
    }

    function selectSemester(semNum) {
        document.querySelectorAll('.sem-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`sem${semNum}Btn`).classList.add('active');

        renderFilteredTableGrid(semNum);
    }

    function renderFilteredTableGrid(targetSem) {
        const tbody = document.getElementById("studentMarksTableBody");
        tbody.innerHTML = "";

        const filtered = globalAcademicRows.filter(record => record.semester === targetSem);

        if (filtered.length > 0) {
            filtered.forEach(record => {
                const percentage = record.total_classes > 0 ? ((record.attended_classes / record.total_classes) * 100).toFixed(1) : 0;
                let badgeClass = "badge badge-good";
                if (percentage < 75) badgeClass = "badge badge-warn";
                if (percentage < 65) badgeClass = "badge badge-crit";

                tbody.innerHTML += `
                    <tr>
                        <td style="text-align: left; font-weight: 600; color: #2c3e50; padding-left: 15px;">${record.subject_name}</td>
                        <td>${record.cie_1 || 0}</td>
                        <td>${record.cie_2 || 0}</td>
                        <td>${record.cie_3 || 0}</td>
                        <td>${record.lab_marks || 0}</td>
                        <td style="font-weight: bold; color: var(--accent);">${record.see_marks || 0}</td>
                        <td>
                            <span class="${badgeClass}">Attended: ${record.attended_classes || 0} / Total: ${record.total_classes || 0} (${percentage}%)</span>
                        </td>
                    </tr>
                `;
            });
        } else {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#7f8c8d; padding:25px;">No records mapped for Semester ${targetSem} inside database.</td></tr>`;
        }
    }

    // Camera Handlers
    function toggleQRScannerBox() {
        const scannerBox = document.getElementById("cameraScannerBox");
        if (scannerBox.style.display === "block") { stopQRScannerCamera(); } 
        else { scannerBox.style.display = "block"; initializeHardwareCameraStream(); }
    }

    function initializeHardwareCameraStream() {
        activeScannerInstance = new Instascan.Scanner({ video: document.getElementById('previewVideo'), mirror: false });
        activeScannerInstance.addListener('scan', async function (content) {
            try {
                const parsedPayload = JSON.parse(content);
                const scanResponse = await fetch("http://localhost:5000/api/attendance/mark", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usn: currentStudentUSN, subject: parsedPayload.subject })
                });
                const responseData = await scanResponse.json();
                if (scanResponse.ok) {
                    alert(`Attendance success: ${responseData.message}`);
                    stopQRScannerCamera();
                    loadStudentDashboardPayload();
                } else { alert(`Scanning rejection: ${responseData.message}`); }
            } catch (err) { alert("Invalid QR code format."); }
        });

        Instascan.Camera.getCameras().then(function (cameras) {
            if (cameras.length > 0) { activeScannerInstance.start(cameras[0]); } 
            else { alert('No webcam detected.'); document.getElementById("cameraScannerBox").style.display = "none"; }
        }).catch(function (e) { console.error(e); });
    }

    function stopQRScannerCamera() {
        if (activeScannerInstance) { activeScannerInstance.stop(); activeScannerInstance = null; }
        document.getElementById("cameraScannerBox").style.display = "none";
    }

    // Modal Forms handlers
    function openEditModal() {
        document.getElementById("editName").value = document.getElementById("profileName").innerText;
        document.getElementById("editEmail").value = cachedUserRawData.email || "";
        document.getElementById("editPassword").value = cachedUserRawData.password || "";
        document.getElementById("profileEditModal").style.display = "flex";
    }
    function closeEditModal() { document.getElementById("profileEditModal").style.display = "none"; }

    async function saveProfileChanges() {
        const updatedName = document.getElementById("editName").value.trim();
        const updatedEmail = document.getElementById("editEmail").value.trim();
        const updatedPassword = document.getElementById("editPassword").value.trim();

        try {
            const res = await fetch(`http://localhost:5000/api/marks/update-profile/${currentStudentUSN}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: updatedName, email: updatedEmail, password: updatedPassword })
            });
            if(res.ok) {
                alert("Profile synchronized successfully!");
                document.getElementById("profileName").innerText = updatedName;
                closeEditModal();
            }
        } catch(e) { alert("Network writing issue."); }
    }

    async function loadStudentDashboardPayload() {
        try {
            const response = await fetch(`http://localhost:5000/api/marks/student-profile/${currentStudentUSN}`);
            const data = await response.json();

            if (response.ok) {
                document.getElementById("profileName").innerText = "Tarun Bali";
                document.getElementById("profileUSN").innerText = currentStudentUSN;
                document.getElementById("profileBranch").innerText = "AIML";
                document.getElementById("profileClassSec").innerText = "2nd Year - A";

                // Save dataset arrays globally
                globalAcademicRows = data.academic || [];
                
                // Auto-trigger Year 1 view layout elements on initial page load
                selectYear(1);
            }
        } catch (err) { console.error(err); }
    }

    function handleStudentLogout() {
        stopQRScannerCamera();
        localStorage.clear();
        window.location.href = "index.html";
    }

    window.onload = loadStudentDashboardPayload;
</script>
</body>
</html>
