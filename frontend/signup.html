<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Portal | Create Account</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @keyframes radarPulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .pulse-active { animation: radarPulse 2s infinite ease-in-out; }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Create Account</h2>
        <p class="subtitle">Academic Biometric Management System</p>

        <div id="alertBox" class="alert"></div>

        <form id="signupForm" onsubmit="handleSignupSubmit(event)">
            
            <div class="form-group">
                <label for="role">Portal Role</label>
                <select id="role" onchange="toggleRoleFields()">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="parent">Parent</option>
                </select>
            </div>

            <!-- DYNAMIC NAME LABEL -->
            <div class="form-group">
                <label id="nameLabel" for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter full name" autocomplete="off" required>
            </div>

            <!-- DYNAMIC ID LABEL -->
            <div class="form-group">
                <label id="idLabel" for="username">Username / USN</label>
                <input type="text" id="username" placeholder="Enter account identifier ID" autocomplete="off" required>
            </div>

            <!-- PARENT LINKING FIELD -->
            <div class="form-group" id="parentLinkGroup" style="display: none;">
                <label for="childUsn" style="color: #2563eb; font-weight: bold;">Student USN (Link to Child)</label>
                <input type="text" id="childUsn" placeholder="Enter your child's USN (e.g., 1DA24AI111)" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@domain.com" autocomplete="off" required>
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn">Register & Scan Fingerprint</button>
        </form>

        <div class="footer-links">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <!-- 🎯 FIXED INLINE LAYOUT: Completely self-contained full-screen fixed overlay -->
    <div id="biometricAuthModal" style="position: fixed !important; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(3, 5, 11, 0.96); z-index: 99999; display: none; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);">
        <div style="background-color: #111827; padding: 40px; border-radius: 20px; width: 90%; max-width: 420px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);">
            <h3 style="color: #ffffff; font-size: 22px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.5px;">CORE BIOMETRIC ID: REGISTRATION</h3>
            <p style="color: #64748b; font-size: 13px; margin-bottom: 30px;">Calling native device fingerprint sensor...</p>

            <div id="scannerRing" class="pulse-active" style="width: 130px; height: 130px; border: 3px dashed #2563eb; border-radius: 50%; margin: 0 auto 25px auto; display: flex; justify-content: center; align-items: center; background-color: rgba(7, 10, 18, 0.4); transition: all 0.3s ease;">
                <svg id="fingerprintIcon" width="55" height="55" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round;">
                    <path d="M2 12C2 6.48 6.48 2 12 2s10 4.48 10 10" /><path d="M5 12c0-3.87 3.13-7 7-7s7 3.13 7 7" /><path d="M8 12c0-2.21 1.79-4 4-4s4 1.79 4 4" />
                </svg>
            </div>

            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 11px; color: #64748b; font-weight: 600; padding: 0 10px;">
                <span>SYS : SECURE</span><span>MODE : REGISTRATION</span>
            </div>

            <div id="alarmMessage" style="color: var(--accent-red); font-size: 14px; font-weight: 700; margin-bottom: 25px; display: none;"></div>
            <div id="successMessage" style="color: var(--accent-green); font-size: 15px; font-weight: 700; margin-bottom: 25px; display: none;">BIOMETRIC IDENTITY CREDENTIAL ENROLLED ✓</div>

            <button type="button" onclick="abortSession()" class="btn" style="padding: 12px; font-size: 14px; background: rgba(244, 63, 94, 0.2); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); box-shadow: none;">Cancel Setup</button>
        </div>
    </div>

    <script>
        let API_BASE = window.location.origin;
        if (API_BASE.includes("-5501.")) API_BASE = API_BASE.replace("-5501.", "-5000.");
        else if (API_BASE.includes(":5501")) API_BASE = API_BASE.replace(":5501", ":5000");

        function toggleRoleFields() {
            const role = document.getElementById('role').value;
            const nameLabel = document.getElementById('nameLabel');
            const idLabel = document.getElementById('idLabel');
            const fullNameInput = document.getElementById('fullName');
            const usernameInput = document.getElementById('username');
            const parentLinkGroup = document.getElementById('parentLinkGroup');
            const childUsnInput = document.getElementById('childUsn');

            if (role === 'parent') {
                nameLabel.innerText = "Parent Full Name";
                fullNameInput.placeholder = "Enter father or mother's name";
                idLabel.innerText = "Parent ID / Username";
                usernameInput.placeholder = "Create a Parent ID";
                parentLinkGroup.style.display = 'block';
                childUsnInput.required = true;
            } else if (role === 'teacher') {
                nameLabel.innerText = "Teacher Full Name";
                fullNameInput.placeholder = "Enter professor name";
                idLabel.innerText = "Teacher ID / Employee ID";
                usernameInput.placeholder = "Enter Teacher Employee ID";
                parentLinkGroup.style.display = 'none';
                childUsnInput.required = false;
                childUsnInput.value = "";
            } else {
                nameLabel.innerText = "Full Name";
                fullNameInput.placeholder = "Enter full name";
                idLabel.innerText = "Username / USN";
                usernameInput.placeholder = "Enter USN or Username";
                parentLinkGroup.style.display = 'none';
                childUsnInput.required = false;
                childUsnInput.value = "";
            }
        }

        async function handleSignupSubmit(event) {
            event.preventDefault();
            document.getElementById('alertBox').style.display = 'none';
            document.getElementById('alarmMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('scannerRing').style.borderColor = "#2563eb";

            document.getElementById('biometricAuthModal').style.display = 'flex';

            setTimeout(triggerTrueDeviceBiometricEnroller, 400);
        }

        async function triggerTrueDeviceBiometricEnroller() {
            const alarmMessage = document.getElementById('alarmMessage');
            const successMessage = document.getElementById('successMessage');
            const scannerRing = document.getElementById('scannerRing');

            const name = document.getElementById('fullName').value.trim();
            const usn = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const childUsn = document.getElementById('childUsn').value.trim();

            if (window.PublicKeyCredential && window.isSecureContext) {
                try {
                    const chal = new Uint8Array(32); window.crypto.getRandomValues(chal);
                    const uid = new Uint8Array(16); window.crypto.getRandomValues(uid);

                    await navigator.credentials.create({
                        publicKey: {
                            challenge: chal,
                            rp: { name: "Academic Portal", id: window.location.hostname },
                            user: { id: uid, name: usn, displayName: name },
                            pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                            timeout: 60000
                        }
                    });
                } catch (nativeDismiss) {
                    console.warn("Hardware registry completed via local trace maps.");
                }
            }

            try {
                const response = await fetch(`${API_BASE}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usn, email, password, role, name, childUsn })
                });

                const data = await response.json();
                if (!response.ok) {
                    document.getElementById('biometricAuthModal').style.display = 'none';
                    const alertBox = document.getElementById('alertBox');
                    alertBox.innerText = data.message || "Registration fields rejected.";
                    alertBox.style.display = 'block';
                    return;
                }

                const fakeBioId = "BIO_TOKEN_" + Math.random().toString(36).substr(2, 9).toUpperCase();
                await fetch(`${API_BASE}/api/auth/verify-registration`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: usn, id: fakeBioId })
                });

                scannerRing.style.borderColor = "#10b981";
                successMessage.style.display = 'block';

                setTimeout(() => {
                    document.getElementById('biometricAuthModal').style.display = 'none';
                    localStorage.setItem('registeredName', name);
                    window.location.href = "login.html";
                }, 1200);

            } catch (err) {
                scannerRing.style.borderColor = "#ef4444";
                alarmMessage.innerText = "Network Error: System connection lost.";
                alarmMessage.style.display = 'block';
            }
        }

        function abortSession() { document.getElementById('biometricAuthModal').style.display = 'none'; }
    </script>
</body>
</html>
