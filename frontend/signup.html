<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Ambedkar Institute of Technology | Create Account</title>
    <style>
        /* ==========================================================================
           🎨 UNIFORM PREMIUM ACADEMIC LIGHT DESIGN SYSTEM 
           ========================================================================== */
        :root {
            --bg-canvas: #f1f5f9;
            --surface-card: #ffffff;
            --primary-blue: #1e40af;
            --primary-hover: #1d4ed8;
            --primary-glow: rgba(30, 64, 175, 0.08);
            
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --text-labels: #475569;
            
            --border-clean: #e2e8f0;
            --input-bg: #ffffff;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            
            --shadow-premium: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 20px 40px -5px rgba(15, 23, 42, 0.05);
            --ease-kinetic: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-fluid: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            overflow-y: auto;
            
            opacity: 0;
            animation: signupFadeIn 0.4s var(--ease-fluid) forwards;
        }

        @keyframes signupFadeIn { to { opacity: 1; } }

        .signup-container {
            background: var(--surface-card);
            border: 1px solid var(--border-clean);
            padding: 44px 40px;
            border-radius: 24px;
            box-shadow: var(--shadow-premium);
            width: 100%;
            max-width: 440px;
            z-index: 10;
            text-align: center;
            margin: auto;
            
            transform: translateY(30px) scale(0.97);
            opacity: 0;
            animation: elasticCardEntrance 0.6s var(--ease-kinetic) 0.05s forwards;
        }

        @keyframes elasticCardEntrance { to { transform: translateY(0) scale(1); opacity: 1; } }

        h2 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--primary-blue);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 36px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-labels);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        input, select {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 1px solid var(--border-clean);
            border-radius: 12px;
            color: var(--text-dark);
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s var(--ease-fluid);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: #ffffff;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-blue);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.2);
            transition: all 0.2s var(--ease-fluid);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 28px;
        }

        .btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 18px rgba(30, 64, 175, 0.35);
            transform: translateY(-1px);
        }

        .btn:active { transform: translateY(1px) scale(0.98); }

        .footer-links {
            margin-top: 26px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .footer-links a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 700;
        }

        .alert {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 22px;
            font-size: 14px;
            display: none;
            text-align: center;
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            font-weight: 500;
        }

        .biometric-modal {
            position: fixed !important;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(241, 245, 249, 0.92);
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        
        @keyframes radarPulse {
            0% { transform: scale(0.96); opacity: 0.9; }
            50% { transform: scale(1.04); opacity: 0.5; }
            100% { transform: scale(0.96); opacity: 0.9; }
        }
        .pulse-active { animation: radarPulse 2s infinite ease-in-out; }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Create Account</h2>
        <p class="subtitle">Academic Biometric Management System</p>

        <div id="alertBox" class="alert"></div>

        <form id="signupForm" onsubmit="handleSignupSubmit(event)">
            
            <div class="form-group">
                <label for="role">Portal Role</label>
                <select id="role" onchange="toggleRoleFields()">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="parent">Parent</option>
                </select>
            </div>

            <div class="form-group" id="teacherSubjectGroup" style="display: none;">
                <label for="teacherSubject" style="color: var(--primary-blue); font-weight: 800;">Assigned Core Subject</label>
                <select id="teacherSubject">
                    <option value="AI">Artificial Intelligence (AI)</option>
                    <option value="DBMS">Database Management Systems (DBMS)</option>
                    <option value="ADA">Analysis & Design of Algorithms (ADA)</option>
                    <option value="MERN">Full-Stack MERN Development (MERN)</option>
                    <option value="CDN">Cloud & Content Delivery Networks (CDN)</option>
                </select>
            </div>

            <div class="form-group">
                <label id="nameLabel" for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter full name" autocomplete="off" required>
            </div>

            <div class="form-group">
                <label id="idLabel" for="username">Username / USN</label>
                <input type="text" id="username" placeholder="Enter account identifier ID" autocomplete="off" required>
            </div>

            <div class="form-group" id="parentLinkGroup" style="display: none;">
                <label for="childUsn" style="color: var(--primary-blue); font-weight: bold;">Student USN (Link to Child)</label>
                <input type="text" id="childUsn" placeholder="Enter your child's USN (e.g., 1DA24AI111)" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@domain.com" autocomplete="off" required>
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn">Register & Scan Biometrics</button>
        </form>

        <div class="footer-links">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <div id="biometricAuthModal" class="biometric-modal">
        <div style="background-color: #ffffff; padding: 40px; border-radius: 24px; width: 90%; max-width: 420px; text-align: center; border: 1px solid var(--border-clean); box-shadow: var(--shadow-premium);">
            <h3 style="color: var(--primary-blue); font-size: 22px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.01em;">BIOMETRIC REGISTRATION</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 30px; font-weight: 500;">Enrolling identity into credential server maps...</p>

            <div id="scannerRing" class="pulse-active" style="width: 130px; height: 130px; border: 3px dashed var(--primary-blue); border-radius: 50%; margin: 0 auto 25px auto; display: flex; justify-content: center; align-items: center; background-color: #f8fafc;">
                <svg width="55" height="55" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12C2 6.48 6.48 2 12 2s10 4.48 10 10" /><path d="M5 12c0-3.87 3.13-7 7-7s7 3.13 7 7" /><path d="M8 12c0-2.21 1.79-4 4-4s4 1.79 4 4" />
                </svg>
            </div>

            <div id="successMessage" style="color: var(--accent-green); font-size: 15px; font-weight: 700; margin-bottom: 10px; display: none;">BIOMETRIC IDENTITY ENROLLED ✓</div>
            <button type="button" onclick="abortSession()" class="btn" style="padding: 12px; font-size: 14px; background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; box-shadow: none; margin-top: 10px;">Cancel Setup</button>
        </div>
    </div>

    <script>
        let API_BASE = window.location.origin;
        if (API_BASE.includes("-5501.")) API_BASE = API_BASE.replace("-5501.", "-5000.");
        else if (API_BASE.includes(":5501")) API_BASE = API_BASE.replace(":5501", ":5000");

        function toggleRoleFields() {
            const role = document.getElementById('role').value;
            const nameLabel = document.getElementById('nameLabel');
            const idLabel = document.getElementById('idLabel');
            const fullNameInput = document.getElementById('fullName');
            const usernameInput = document.getElementById('username');
            const parentLinkGroup = document.getElementById('parentLinkGroup');
            const childUsnInput = document.getElementById('childUsn');
            const teacherSubjectGroup = document.getElementById('teacherSubjectGroup');

            if (role === 'parent') {
                nameLabel.innerText = "Parent Full Name";
                fullNameInput.placeholder = "Enter father or mother's name";
                idLabel.innerText = "Parent ID / Username";
                usernameInput.placeholder = "Create a Parent ID";
                parentLinkGroup.style.display = 'block';
                teacherSubjectGroup.style.display = 'none';
                childUsnInput.required = true;
            } else if (role === 'teacher') {
                nameLabel.innerText = "Teacher Full Name";
                fullNameInput.placeholder = "Enter professor name";
                idLabel.innerText = "Teacher ID / Employee ID";
                usernameInput.placeholder = "Enter Teacher Employee ID";
                parentLinkGroup.style.display = 'none';
                teacherSubjectGroup.style.display = 'block'; // 🎯 Display subject selection configuration
                childUsnInput.required = false;
                childUsnInput.value = "";
            } else {
                nameLabel.innerText = "Full Name";
                fullNameInput.placeholder = "Enter full name";
                idLabel.innerText = "Username / USN";
                usernameInput.placeholder = "Enter USN or Username";
                parentLinkGroup.style.display = 'none';
                teacherSubjectGroup.style.display = 'none';
                childUsnInput.required = false;
                childUsnInput.value = "";
            }
        }

        async function handleSignupSubmit(event) {
            event.preventDefault();
            document.getElementById('alertBox').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('biometricAuthModal').style.display = 'flex';

            setTimeout(executeDatabaseFirstSignup, 400);
        }

        async function executeDatabaseFirstSignup() {
            const successMessage = document.getElementById('successMessage');
            const name = document.getElementById('fullName').value.trim();
            const usn = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const childUsn = document.getElementById('childUsn').value.trim();
            const subjectName = document.getElementById('teacherSubject').value; // 🎯 Catch data payload element value

            try {
                /* 🎯 STEP 1: Post complete data array parameters to Express route handler */
                const response = await fetch(`${API_BASE}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usn, email, password, role, name, childUsn, subjectName })
                });

                const data = await response.json();
                if (!response.ok) {
                    document.getElementById('biometricAuthModal').style.display = 'none';
                    const alertBox = document.getElementById('alertBox');
                    alertBox.innerText = data.message || "Registration fields rejected.";
                    alertBox.style.display = 'block';
                    return;
                }

                /* 🎯 STEP 2: Handle device hardware handshakes */
                if (window.PublicKeyCredential && window.isSecureContext) {
                    try {
                        const chal = new Uint8Array(32); window.crypto.getRandomValues(chal);
                        const uid = new Uint8Array(16); window.crypto.getRandomValues(uid);
                        await navigator.credentials.create({
                            publicKey: {
                                challenge: chal,
                                rp: { name: "Academic Portal", id: window.location.hostname },
                                user: { id: uid, name: usn, displayName: name },
                                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                                timeout: 10000
                            }
                        });
                    } catch (err) { 
                        console.warn("No native scanner asset located on device canvas. Bypassing hardware layer."); 
                    }
                }

                /* 🎯 STEP 3: Map security credentials down to data index hashes */
                const fakeBioId = "BIO_TOKEN_" + Math.random().toString(36).substr(2, 9).toUpperCase();
                await fetch(`${API_BASE}/api/auth/verify-registration`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: usn, id: fakeBioId })
                });

                successMessage.style.display = 'block';
                setTimeout(() => {
                    document.getElementById('biometricAuthModal').style.display = 'none';
                    window.location.href = "login.html";
                }, 1200);

            } catch (err) {
                document.getElementById('biometricAuthModal').style.display = 'none';
                document.getElementById('alertBox').innerText = "Network Error: Server unreachable.";
                document.getElementById('alertBox').style.display = 'block';
            }
        }

        function abortSession() { document.getElementById('biometricAuthModal').style.display = 'none'; }
    </script>
</body>
</html>
