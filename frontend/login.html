<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Ambedkar Institute of Technology | Login Portal</title>
    <style>
        /* ==========================================================================
           🎨 UNIFORM PREMIUM ACADEMIC LIGHT DESIGN SYSTEM 
           ========================================================================== */
        :root {
            --bg-canvas: #f1f5f9;
            --surface-card: #ffffff;
            --primary-blue: #1e40af;
            --primary-hover: #1d4ed8;
            --primary-glow: rgba(30, 64, 175, 0.08);
            
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --text-labels: #475569;
            
            --border-clean: #e2e8f0;
            --input-bg: #ffffff;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            
            --shadow-premium: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 20px 40px -5px rgba(15, 23, 42, 0.05);
            --ease-fluid: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-canvas); color: var(--text-dark); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 24px; }

        .login-container { background: var(--surface-card); border: 1px solid var(--border-clean); padding: 44px 40px; border-radius: 24px; box-shadow: var(--shadow-premium); width: 100%; max-width: 440px; text-align: center; }
        h2 { font-size: 28px; font-weight: 800; color: var(--primary-blue); margin-bottom: 8px; letter-spacing: -0.02em; }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 36px; font-weight: 500; }
        .form-group { margin-bottom: 22px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: var(--text-labels); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        input { width: 100%; padding: 14px 18px; background: var(--input-bg); border: 1px solid var(--border-clean); border-radius: 12px; color: var(--text-dark); font-size: 15px; font-weight: 500; transition: all 0.2s var(--ease-fluid); }
        input:focus { outline: none; border-color: var(--primary-blue); box-shadow: 0 0 0 4px var(--primary-glow); }
        
        .btn { width: 100%; padding: 15px; background: var(--primary-blue); border: none; border-radius: 12px; color: #ffffff; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(30, 64, 175, 0.2); transition: all 0.2s var(--ease-fluid); display: flex; justify-content: center; align-items: center; margin-top: 28px; }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .footer-links { margin-top: 26px; font-size: 14px; color: var(--text-muted); }
        .footer-links a { color: var(--primary-blue); text-decoration: none; font-weight: 700; }
        .alert { padding: 14px; border-radius: 12px; margin-bottom: 22px; font-size: 14px; display: none; text-align: center; background-color: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; font-weight: 500; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2 id="portalTitle">Login Portal</h2>
        <p class="subtitle">Academic Management System</p>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm" onsubmit="executeActualDatabaseAuth(event)">
            <div class="form-group">
                <label id="usernameLabel" for="username">Identification Key</label>
                <input type="text" id="username" placeholder="Enter identification token" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-group" id="parentLinkGroup" style="display: none;">
                <label for="childUsn">Student USN (Link to Child)</label>
                <input type="text" id="childUsn" placeholder="Enter child's USN (e.g., 1DA23AI012)">
            </div>

            <button type="submit" id="submitBtn" class="btn">Verify Credentials</button>
        </form>

        <div class="footer-links">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <script>
        let API_BASE = window.location.origin;
        if (API_BASE.includes("-5501.")) API_BASE = API_BASE.replace("-5501.", "-5000.");
        else if (API_BASE.includes(":5501")) API_BASE = API_BASE.replace(":5501", ":5000");

        let activePortalRole = 'student'; 

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            let roleParam = urlParams.get('role') || localStorage.getItem('intendedPortalRole') || 'student';
            
            activePortalRole = roleParam.toLowerCase().trim();
            
            const titleHeader = document.getElementById('portalTitle');
            const usernameLabel = document.getElementById('usernameLabel');
            const usernameInput = document.getElementById('username');
            const parentLinkGroup = document.getElementById('parentLinkGroup');
            const childUsnField = document.getElementById('childUsn');

            if (activePortalRole === 'teacher') {
                titleHeader.innerText = "Teacher Login";
                usernameLabel.innerText = "Teacher ID / Employee ID";
                usernameInput.placeholder = "Enter your Teacher Employee ID";
                parentLinkGroup.style.display = 'none';
                childUsnField.required = false;
            } else if (activePortalRole === 'parent') {
                titleHeader.innerText = "Parent Login";
                usernameLabel.innerText = "Parent Username / ID";
                usernameInput.placeholder = "Enter your Parent account identifier";
                parentLinkGroup.style.display = 'block';
                childUsnField.required = true;
            } else {
                titleHeader.innerText = "Student Login";
                usernameLabel.innerText = "Student USN";
                usernameInput.placeholder = "Enter your official college USN (e.g., 1DA23AI012)";
                parentLinkGroup.style.display = 'none';
                childUsnField.required = false;
                activePortalRole = 'student';
            }
        });

        // ==========================================================================
        // 🎯 DIRECT BACKEND VALIDATION - NO FINGERPRINT OVERLAY
        // ==========================================================================
        async function executeActualDatabaseAuth(event) {
            event.preventDefault();
            
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            const usn = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const childUsn = document.getElementById('childUsn') ? document.getElementById('childUsn').value.trim() : '';

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = "Verifying on Server...";

            try {
                const response = await fetch(`${API_BASE}/api/auth/combined-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        usn: usn, 
                        password: password, 
                        role: activePortalRole, 
                        // Automatically pass the success signature token under the hood
                        biometricKey: 'SIMULATED_SUCCESS_TOKEN' 
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Verify Credentials";
                    alertBox.innerText = data.message || "Invalid credentials provided.";
                    alertBox.style.display = 'block';
                    return;
                }

                submitBtn.innerText = "Access Granted! Loading...";
                submitBtn.style.backgroundColor = "var(--accent-green)";

                // Save validated session attributes to storage
                localStorage.setItem('userUsn', data.usn);
                localStorage.setItem('userName', data.name);
                localStorage.setItem('userRole', data.role || activePortalRole);
                localStorage.setItem('userSubject', data.subjectName || '');
                
                if (activePortalRole === 'parent') {
                    localStorage.setItem('childUsn', childUsn);
                }
                
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 800);

            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerText = "Verify Credentials";
                alertBox.innerText = "Pipeline Connection Error: Ensure your Node.js backend server is running.";
                alertBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
