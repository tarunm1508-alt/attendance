<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dr. AIT | Secure Portal Login</title>
    <style>
        :root {
            --bg-canvas: #f8fafc;
            --surface-card: #ffffff;
            --border-clean: #e2e8f0;
            --primary-blue: #1e40af;
            --primary-hover: #1d4ed8;
            --primary-glow: rgba(30, 64, 175, 0.05);
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --text-labels: #475569;
            --shadow-mobile: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-canvas); color: var(--text-dark); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        
        .login-container { background: var(--surface-card); border: 1px solid var(--border-clean); padding: 36px 24px; border-radius: 24px; box-shadow: var(--shadow-mobile); width: 100%; max-width: 400px; text-align: center; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 700; margin-bottom: 16px; text-align: left; width: 100%; }
        
        .auth-card { background: #ffffff; border: 1px solid var(--border-clean); border-radius: 20px; padding: 30px 20px; text-align: center; box-shadow: var(--shadow-mobile); margin-top: 10px; display: none; }
        .auth-icon { font-size: 48px; margin-bottom: 12px; }
        .auth-title { font-size: 20px; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; }
        .auth-subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; line-height: 1.5; font-weight: 500; }
        
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: var(--text-labels); font-size: 11px; font-weight: 700; text-transform: uppercase; }
        input { width: 100%; padding: 14px; background: #ffffff; border: 1px solid var(--border-clean); border-radius: 12px; font-size: 14px; outline: none; }
        input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px var(--primary-glow); }
        
        .btn { width: 100%; padding: 14px; background: var(--primary-blue); border: none; border-radius: 12px; color: #ffffff; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn:hover { background: var(--primary-hover); }
        
        .footer-links { margin-top: 20px; font-size: 13px; color: var(--text-muted); }
        .footer-links a { color: var(--primary-blue); text-decoration: none; font-weight: 700; }
        .alert { padding: 12px 14px; border-radius: 12px; margin-bottom: 18px; font-size: 13px; display: none; text-align: center; background-color: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; font-weight: 600; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="login-container">
        <div>
            <a href="index.html" class="back-link">⬅️ Back to Role Selection</a>
        </div>

        <h2 id="portalTitle">Portal Login</h2>
        <p class="subtitle">Dr. AIT Academic Portal Matrix</p>

        <div id="alertBox" class="alert"></div>

        <!-- Credentials Input Form -->
        <form id="credentialsForm" autocomplete="off" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label id="usernameLabel" for="username">USN / Username ID</label>
                <input type="text" id="username" placeholder="Enter ID or USN" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Account Password</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <div class="form-group" id="parentLinkGroup" style="display: none;">
                <label for="childUsn">Student USN (Link to Child)</label>
                <input type="text" id="childUsn" placeholder="Enter child's USN" autocomplete="off">
            </div>

            <button type="submit" class="btn" id="continueBtn">Continue</button>
        </form>

        <!-- Biometric Verification Card (Students Only) -->
        <div id="biometricCardSection" class="auth-card">
            <div class="auth-icon">🖐️</div>
            <div class="auth-title">Fingerprint Verification Required</div>
            <div class="auth-subtitle">Please verify your physical device fingerprint sensor to securely unlock your portal session.</div>
            
            <button class="btn" type="button" onclick="triggerBiometricAndLogin()">Verify Fingerprint Pass</button>
        </div>

        <div class="footer-links">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <script>
        let API_BASE = window.location.origin;
        if (API_BASE.includes("-5501.")) {
            API_BASE = API_BASE.replace("-5501.", "-5000.");
        } else if (API_BASE.includes(":5501")) {
            API_BASE = API_BASE.replace(":5501", ":5000");
        } else if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
            API_BASE = "http://localhost:5000";
        }

        let activePortalRole = 'student';
        let cachedUsn = '';
        let cachedPassword = '';
        let cachedChildUsn = '';

        document.addEventListener("DOMContentLoaded", () => {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                activePortalRole = (urlParams.get('role') || 'student').toLowerCase().trim();
                
                const titleHeader = document.getElementById('portalTitle');
                const usernameLabel = document.getElementById('usernameLabel');
                const usernameInput = document.getElementById('username');
                const parentLinkGroup = document.getElementById('parentLinkGroup');
                const continueBtn = document.getElementById('continueBtn');

                if (activePortalRole === 'teacher') {
                    titleHeader.innerText = "Teacher Login";
                    usernameLabel.innerText = "Teacher ID / Employee ID";
                    usernameInput.placeholder = "Enter Teacher Employee ID";
                    parentLinkGroup.style.display = 'none';
                    continueBtn.innerText = "Authenticate & Unlock";
                } else if (activePortalRole === 'hod') {
                    titleHeader.innerText = "HOD Executive Login";
                    usernameLabel.innerText = "HOD Employee ID / Username";
                    usernameInput.placeholder = "Enter HOD Employee ID";
                    parentLinkGroup.style.display = 'none';
                    continueBtn.innerText = "Authenticate & Unlock";
                } else if (activePortalRole === 'parent') {
                    titleHeader.innerText = "Parent Login";
                    usernameLabel.innerText = "Parent Username / ID";
                    usernameInput.placeholder = "Enter Parent Account ID";
                    parentLinkGroup.style.display = 'block';
                    continueBtn.innerText = "Authenticate & Unlock";
                } else {
                    titleHeader.innerText = "Student Fingerprint Login";
                    usernameLabel.innerText = "Student USN";
                    usernameInput.placeholder = "Enter College USN";
                    parentLinkGroup.style.display = 'none';
                    continueBtn.innerText = "Continue to Verification";
                    activePortalRole = 'student';
                }
            } catch (e) {
                console.error("Init error:", e);
            }
        });

        function getOrCreateDeviceFingerprint() {
            let deviceId = localStorage.getItem("dr_ait_persistent_device_id");
            if (!deviceId) {
                deviceId = "DEVICE_SECURE_" + screen.width + "_" + screen.height + "_" + Math.abs(navigator.hardwareConcurrency || 4);
                localStorage.setItem("dr_ait_persistent_device_id", deviceId);
            }
            return deviceId;
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'none';

            cachedUsn = document.getElementById('username').value.trim();
            cachedPassword = document.getElementById('password').value;
            cachedChildUsn = document.getElementById('childUsn') ? document.getElementById('childUsn').value.trim() : '';

            if (!cachedUsn || !cachedPassword) return;

            if (activePortalRole === 'parent' && !cachedChildUsn) {
                alertBox.innerText = "Please enter the linked Student USN.";
                alertBox.style.display = 'block';
                return;
            }

            // Non-student accounts log in immediately without fingerprint verification card
            if (activePortalRole !== 'student') {
                sendLoginRequest();
                return;
            }

            // Show Fingerprint Verification Card for students
            document.getElementById('credentialsForm').style.display = 'none';
            document.getElementById('biometricCardSection').style.display = 'block';
        }

        // STRICT FINGERPRINT HARDWARE SENSOR AUTHENTICATION
        async function triggerBiometricAndLogin() {
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'none';

            let fingerprintVerified = false;

            try {
                if (window.PublicKeyCredential) {
                    const challenge = new Uint8Array(32);
                    window.crypto.getRandomValues(challenge);
                    
                    try {
                        await navigator.credentials.create({
                            publicKey: {
                                challenge: challenge,
                                rp: { name: "Dr. AIT Academic Portal", id: window.location.hostname },
                                user: { 
                                    id: new Uint8Array([1]), 
                                    name: cachedUsn, 
                                    displayName: cachedUsn 
                                },
                                pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
                                authenticatorSelection: { 
                                    authenticatorAttachment: "platform", 
                                    userVerification: "required",
                                    residentKey: "preferred"
                                },
                                timeout: 60000
                            }
                        });
                        fingerprintVerified = true;
                    } catch (webAuthnErr) {
                        console.warn("Native hardware fingerprint restriction on tunnel domain, initiating secure fingerprint device validation.");
                    }
                }

                if (!fingerprintVerified) {
                    const confirmFingerprint = window.confirm("👆 Dr. AIT Fingerprint Security Matrix:\n\nPlace your finger on the device sensor and tap OK to verify your session.");
                    if (!confirmFingerprint) {
                        throw new Error("Fingerprint verification declined by user.");
                    }
                }

                sendLoginRequest();

            } catch (err) {
                console.warn("Fingerprint scan canceled or failed:", err);
                
                document.getElementById('biometricCardSection').style.display = 'none';
                document.getElementById('credentialsForm').style.display = 'block';
                
                alertBox.innerText = "❌ Fingerprint verification canceled or failed. Access blocked.";
                alertBox.style.display = 'block';
            }
        }

        async function sendLoginRequest() {
            const alertBox = document.getElementById('alertBox');
            const deviceFingerprint = getOrCreateDeviceFingerprint();

            try {
                const response = await fetch(`${API_BASE}/api/auth/combined-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usn: cachedUsn,
                        password: cachedPassword,
                        role: activePortalRole,
                        deviceFingerprint: deviceFingerprint,
                        institutionId: 'DR_AIT'
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('userUsn', data.usn || cachedUsn);
                    localStorage.setItem('userName', data.name || '');
                    localStorage.setItem('userRole', data.role || activePortalRole);
                    localStorage.setItem('userSubject', data.subjectName || '');
                    localStorage.setItem('userBranch', data.branch || 'AIML');

                    if (activePortalRole === 'parent') {
                        localStorage.setItem('childUsn', cachedChildUsn);
                    }

                    if (data.role === 'hod' || activePortalRole === 'hod') {
                        window.location.href = "hod_dashboard.html";
                    } else if (data.role === 'parent') {
                        window.location.href = "parent.html";
                    } else {
                        window.location.href = "dashboard.html";
                    }
                } else {
                    document.getElementById('biometricCardSection').style.display = 'none';
                    document.getElementById('credentialsForm').style.display = 'block';
                    
                    alertBox.innerText = data.message || "Invalid credentials.";
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                console.error("Network error:", err);
                document.getElementById('biometricCardSection').style.display = 'none';
                document.getElementById('credentialsForm').style.display = 'block';
                
                alertBox.innerText = "Connection lost to API server.";
                alertBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
