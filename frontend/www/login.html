<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Portal | Sign In</title>
    <style>
        :root {
            --bg-canvas: #f1f5f9;
            --surface-card: #ffffff;
            --primary-blue: #1e40af;
            --primary-hover: #1d4ed8;
            --primary-glow: rgba(30, 64, 175, 0.08);
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --text-labels: #475569;
            --border-clean: #e2e8f0;
            --input-bg: #ffffff;
            --shadow-premium: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background-color: var(--bg-canvas); color: var(--text-dark); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 24px; }

        .login-container {
            background: var(--surface-card);
            border: 1px solid var(--border-clean);
            padding: 44px 40px;
            border-radius: 24px;
            box-shadow: var(--shadow-premium);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        h2 { font-size: 28px; font-weight: 800; color: var(--primary-blue); margin-bottom: 8px; }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; font-weight: 500; }

        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: var(--text-labels); font-size: 12px; font-weight: 700; text-transform: uppercase; }

        .password-input-wrapper { position: relative; display: flex; align-items: center; }
        .password-input-wrapper input { padding-right: 45px; }
        .toggle-password-btn { position: absolute; right: 12px; background: none; border: none; cursor: pointer; font-size: 16px; color: var(--text-muted); padding: 4px; }

        input, select {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 1px solid var(--border-clean);
            border-radius: 12px;
            color: var(--text-dark);
            font-size: 15px;
            font-weight: 500;
        }

        input:focus, select:focus { outline: none; border-color: var(--primary-blue); box-shadow: 0 0 0 4px var(--primary-glow); }

        .btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-blue);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }

        .footer-links { margin-top: 24px; font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .footer-links a { color: var(--primary-blue); text-decoration: none; font-weight: 700; }

        .alert { padding: 14px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; display: none; text-align: center; background-color: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }

        /* 📱 CLEAN ANTI-PROXY MODAL */
        .bio-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px);
            z-index: 9999; display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .bio-modal {
            background: #ffffff; width: 100%; max-width: 340px; padding: 36px 24px;
            border-radius: 24px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            animation: popUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popUp { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .fingerprint-icon {
            font-size: 56px; margin-bottom: 16px; display: inline-block;
            animation: pulseSensor 1.8s infinite ease-in-out;
        }
        @keyframes pulseSensor {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.12); opacity: 1; text-shadow: 0 0 15px rgba(30, 64, 175, 0.4); }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .bio-modal h3 { font-size: 20px; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; }
        .bio-modal p { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; line-height: 1.5; }
        .bio-action-btn {
            width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; font-size: 15px;
            background: var(--primary-blue); color: #fff; margin-bottom: 10px; transition: background 0.2s;
        }
        .bio-action-btn:hover { background: var(--primary-hover); }
        .bio-cancel-btn {
            width: 100%; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; font-size: 14px;
            background: #f1f5f9; color: var(--text-labels);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Sign In</h2>
        <p class="subtitle" id="portalRoleSubtitle">Access your academic workspace</p>

        <div id="alertBox" class="alert"></div>

        <!-- Added autocomplete="off" to prevent password manager passkey interception -->
        <form id="loginForm" onsubmit="handleFormSubmit(event)" autocomplete="off">

            <div class="form-group">
                <label for="role">Portal Role</label>
                <select id="role" onchange="toggleLoginRole()">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="hod">HOD (Head of Department)</option>
                    <option value="parent">Parent</option>
                </select>
            </div>

            <div class="form-group">
                <label id="idLabel" for="username">Username / USN</label>
                <input type="text" id="username" placeholder="Enter ID or USN" autocomplete="off" required style="text-transform:uppercase;">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" required>
                    <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('password', this)">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn">Authenticate & Unlock</button>
        </form>

        <div class="footer-links">
            Don't have an account? <a href="signup.html">Create Account</a>
        </div>
    </div>

    <!-- 👆 STANDALONE ANTI-PROXY BIOMETRIC MODAL -->
    <div id="biometricModal" class="bio-overlay">
        <div class="bio-modal">
            <div class="fingerprint-icon">👆</div>
            <h3>Anti-Proxy Fingerprint Lock</h3>
            <p>Verify your physical device presence via your phone scanner to authorize secure entry.</p>
            <button type="button" class="bio-action-btn" onclick="confirmBiometricScan()">Verify Fingerprint Now</button>
            <button type="button" class="bio-cancel-btn" onclick="closeBiometricModal()">Cancel</button>
        </div>
    </div>

    <script>
        let API_BASE = "https://dr-ait-portal-backend.onrender.com";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roleParam = urlParams.get('role');
            if (roleParam) {
                const roleSelect = document.getElementById('role');
                roleSelect.value = roleParam;
            }
            toggleLoginRole();
        };

        function togglePasswordVisibility(inputId, btnElement) {
            const inputField = document.getElementById(inputId);
            if (inputField.type === "password") {
                inputField.type = "text";
                btnElement.innerText = "🙈";
            } else {
                inputField.type = "password";
                btnElement.innerText = "👁️";
            }
        }

        function toggleLoginRole() {
            const role = document.getElementById('role').value;
            const subtitle = document.getElementById('portalRoleSubtitle');
            subtitle.innerText = `Sign in to ${role.toUpperCase()} Workspace`;
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const role = document.getElementById('role').value;

            if (role === 'hod' || role === 'teacher') {
                const enteredPasscode = prompt(`🔒 Security Passcode Required: Enter the authorized ${role.toUpperCase()} privacy password:`);
                const privacyPassword = "AIT@2026";

                if (enteredPasscode !== privacyPassword) {
                    alert("❌ Incorrect password. Please enter the correct code.");
                    return; 
                }
            }

            // Open custom UI modal safely without invoking browser WebAuthn passkey manager
            document.getElementById('biometricModal').style.display = 'flex';
        }

        function closeBiometricModal() {
            document.getElementById('biometricModal').style.display = 'none';
        }

        async function confirmBiometricScan() {
            closeBiometricModal();

            if (navigator.vibrate) {
                navigator.vibrate(60);
            }

            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'none';

            const role = document.getElementById('role').value;
            const usn = document.getElementById('username').value.trim().toUpperCase();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usn, password, role, institutionId: 'DR_AIT' })
                });

                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    alertBox.innerText = data.message || "Login restricted. Invalid credentials.";
                    alertBox.style.display = 'block';
                    return;
                }

                localStorage.setItem('userRole', data.role);
                localStorage.setItem('userUsn', data.usn);
                localStorage.setItem('userName', data.name);
                localStorage.setItem('userBranch', data.branch || 'AIML');
                localStorage.setItem('institutionId', data.institutionId);

                if (data.role === 'hod') {
                    window.location.href = "hod_dashboard.html";
                } else {
                    window.location.href = "dashboard.html";
                }

            } catch (err) {
                alertBox.innerText = "Server connection error: " + err.message;
                alertBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
